name: Shell Script Scan

permissions:
  contents: read

on:
  push:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.zsh'
  pull_request:
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '**/*.zsh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          files="$(git ls-files '*.sh' '*.bash' '*.zsh')"
          if [ -n "$files" ]; then
            shellcheck $files
          else
            echo "No shell scripts to check."
          fi
